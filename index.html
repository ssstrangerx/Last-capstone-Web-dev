<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUMS</title>
    <link rel="stylesheet" href="login_style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="shortcut icon" href="logo.jpg" type="image/jpg" />
  </head>
  <body>
    <center>
      <h1
        style="
          font-family: Verdana, Geneva, Tahoma, sans-serif;
          font-size: 40px;
        "
      >
        Smart University Management System
      </h1>
    </center>
    <form id="loginForm">
      <center>
        <h2
          style="
            font-family:
              &quot;Franklin Gothic Medium&quot;, &quot;Arial Narrow&quot;,
              Arial, sans-serif;
            font-size: 40px;
          "
        >
          Login
        </h2>
      </center>
      <label for="email">Email ID:</label><br />
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="password">Password:</label><br />
      <input
        type="password"
        id="password"
        name="password"
        required
      /><br /><br />
      <!-- choose whether teacher or student -->
      <p class="role-title"><b>Login As:</b></p>

      <div class="role-group">
        <label class="role-option">
          <input type="radio" name="role" value="student" required />Student
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="teacher" required />Teacher
        </label>
      </div>
      <input type="submit" value="Submit" />
      <p style="text-align: center; margin-top: 10px">Don't have an account?</p>

      <div style="text-align: center">
        <a href="form.html">Register as Student</a> |
        <a href="teacher_form.html">Register as Teacher</a>
      </div>
    </form>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          try {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const selectedRole = document.querySelector(
              'input[name="role"]:checked',
            ).value;

            console.log("🔐 Login attempt:", { email, selectedRole });

            const { data, error } = await client.auth.signInWithPassword({
              email,
              password,
            });

            if (error) {
              console.error("❌ Auth Error:", error);
              alert("Login failed: Check your email/password");
              return;
            }

            console.log("✅ Auth success, user ID:", data.user.id);

            // 1. FETCH PROFILE
            const { data: profile, error: profileError } = await client
              .from("profiles")
              .select("*")
              .eq("id", data.user.id)
              .maybeSingle();

            console.log("Profile fetch result:", { profile, profileError });

            // 2. THE CHECK
            if (!profile) {
              console.error("No profile found for user:", data.user.id);
              alert(
                "Auth account exists, but no profile found! Please re-register or contact admin.",
              );
              return;
            }

            console.log("✅ Profile found:", profile.role);

            // 3. MATCH ROLE TO RADIO BUTTON
            if (profile.role.toLowerCase() !== selectedRole.toLowerCase()) {
              console.warn("Role mismatch:", {
                profileRole: profile.role,
                selectedRole,
              });
              alert(
                `Access Denied: You are registered as a ${profile.role}, but tried to login as a ${selectedRole}.`,
              );
              return;
            }

            console.log("✅ Role match successful");

            // 4. REDIRECT
            if (profile.role === "student") {
              console.log("→ Redirecting to Students.html");
              window.location.href = "Students.html";
            } else if (profile.role === "teacher") {
              console.log("→ Redirecting to teacher.html");
              window.location.href = "teacher.html";
            }
          } catch (err) {
            console.error("❌ Unexpected login error:", err);
            alert("Login error: " + err.message);
          }
        });
    </script>
  </body>
</html>
